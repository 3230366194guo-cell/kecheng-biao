<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>温中实验中学七年级九班课程表</title>
<style>
  :root{
    --bg:#f4f1ea;
    --ink:#3f3a45;
    --muted:#9b93a3;
    --card:#ffffff;
    --line:#e9e4d9;
    --gold:#e9b949;
    --brand-a:#6c8cff;
    --brand-b:#63c9a5;
    --shadow:0 10px 30px rgba(90,80,60,.08), 0 2px 6px rgba(90,80,60,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 115% -10%, rgba(108,140,255,.10), transparent 60%),
      radial-gradient(700px 420px at -10% 0%, rgba(99,201,165,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:26px 18px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* ===== 顶部信息条 ===== */
  .topbar{
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:16px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    position:relative;overflow:hidden;
  }
  .topbar::after{ /* 右上装饰 */
    content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(233,185,73,.22), rgba(108,140,255,.10) 60%, transparent 72%);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{
    width:58px;height:58px;border-radius:50%;flex:none;
    background:#fff;
    object-fit:contain;padding:6px;
    box-shadow:0 6px 16px rgba(96,130,220,.28), 0 0 0 2px rgba(255,255,255,.7) inset;
  }
  .brand h1{
    font-size:23px;letter-spacing:1.5px;line-height:1.3;
    background:linear-gradient(120deg,#5561c8,#3f8f8f 55%,#c89a3c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .spacer{flex:1}

  .today-card{text-align:right;line-height:1.5;position:relative;z-index:1}
  .today-card .d{font-size:21px;font-weight:700}
  .today-card .d b{color:#3f7fdd;font-weight:800}
  .today-card .w{font-size:13px;color:var(--muted)}
  .today-card .w b{color:var(--ink)}

  .wx{
    position:relative;z-index:1;
    display:flex;align-items:center;gap:13px;
    background:linear-gradient(135deg,#eef3ff,#e9f9f2);
    border:1px solid rgba(120,150,220,.25);
    border-radius:16px;padding:9px 16px 9px 12px;min-width:230px;
    cursor:pointer;user-select:none;transition:transform .15s;
  }
  .wx:hover{transform:translateY(-2px)}
  .wx .ic{font-size:34px;line-height:1}
  .wx .m1{font-size:16px;font-weight:800;display:flex;align-items:baseline;gap:5px}
  .wx .m1 small{font-size:11px;font-weight:600;color:var(--muted)}
  .wx .m2{font-size:11.5px;color:#6b728e;margin-top:1px}
  .wx .city{font-size:11.5px;color:#5a6888;margin-top:2px}
  .wx .city::before{content:"📍 ";}

  .weekend-banner{
    display:none;margin-top:16px;text-align:center;
    background:linear-gradient(90deg,#fff7e0,#fff1f2,#eef6ff);
    border:1px dashed var(--gold);border-radius:16px;
    padding:12px;font-size:15px;color:#8a6d1f;letter-spacing:1px;
  }
  .weekend-banner.show{display:block}

  /* ===== 课表主体 ===== */
  .board{
    margin-top:18px;
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.85);
    overflow:hidden;
  }
  table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  col.time{width:136px}
  th{
    padding:15px 6px;
    background:#fbf9f4;
    font-size:17px;letter-spacing:3px;color:#57525f;
    border-bottom:2px solid var(--line);
    position:relative;
  }
  th .cn{font-size:12px;color:var(--muted);letter-spacing:1px;font-weight:400;margin-top:3px}
  th.today{background:linear-gradient(180deg,#fff4d8,#fffaf0)}
  th.today .cn{color:#b98a17}
  th .pill{
    position:absolute;top:9px;right:10px;font-size:10.5px;line-height:1;
    background:linear-gradient(120deg,#ff9d6c,#ff5f6d);
    color:#fff;padding:3.5px 8px;border-radius:99px;
    letter-spacing:0;box-shadow:0 3px 8px rgba(255,95,109,.35);
  }
  td{
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:6px;height:66px;vertical-align:middle;
    transition:background .3s;
  }
  td.time-cell{
    background:#faf8f2;text-align:center;width:136px;
  }
  tr:last-child td{border-bottom:none}
  td:last-child{border-right:none}

  .tlab{font-size:15px;font-weight:700;color:#57525f;white-space:nowrap}
  .tlab small{display:block;font-size:11px;color:#a99fb3;font-weight:400;margin-top:4px;letter-spacing:2px}
  td.live .tlab{color:#e0564f}
  td.live .tlab::before{content:"●";font-size:9px;vertical-align:2px;color:#ff5f6d;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.25}}

  .cell{height:100%;position:relative}
  .card{
    height:100%;border-radius:14px;padding:7px 8px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
    cursor:default;text-align:center;user-select:none;overflow:hidden;
  }
  .card .ico{font-size:19px;line-height:1}
  .card .nm{font-size:17px;font-weight:700;line-height:1.22;word-break:break-all}
  .card:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 16px rgba(90,80,60,.14);filter:saturate(1.06)}
  .cell.now .card{box-shadow:0 0 0 2px #ffb648 inset}
  .badge{
    position:absolute;top:-8px;right:-4px;font-size:10px;color:#fff;
    background:linear-gradient(120deg,#ff8a5c,#ff4f6a);
    padding:2.5px 7px;border-radius:99px;letter-spacing:0;
    box-shadow:0 3px 8px rgba(255,80,110,.4);white-space:nowrap;z-index:2;
  }
  .empty{
    height:100%;border-radius:14px;
    background:repeating-linear-gradient(135deg,#faf8f2 0 6px,#f6f3ea 6px 12px);
    display:flex;align-items:center;justify-content:center;
    color:#d6cfc0;font-size:16px;letter-spacing:2px;
  }
  .empty:hover{background:#f6f3ea}

  .ed{
    width:100%;height:100%;border:2px solid #6c8cff;border-radius:10px;
    font:inherit;font-size:15px;text-align:center;padding:4px;
    background:#fff;outline:none;
  }

  tr.noon td{
    background:
      linear-gradient(90deg, transparent, rgba(233,185,73,.05) 30%, rgba(233,185,73,.05) 70%, transparent);
    border-top:2px dashed #e8d9b0;border-bottom:2px dashed #e8d9b0;
    height:38px;text-align:center;color:#a08a5a;letter-spacing:8px;font-size:14.5px;
  }
  tr.noon .noon-t{letter-spacing:1px;color:#b3a887;font-size:12.5px;background:transparent;font-weight:600}
  tr.noon td .ico{font-size:15px;margin-right:6px;letter-spacing:0}

  /* ===== 页脚 ===== */
  .foot{
    margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    color:var(--muted);font-size:12.5px;
  }
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:99px;
    padding:6px 14px;display:inline-flex;gap:6px;align-items:center;
    box-shadow:0 3px 8px rgba(90,80,60,.06);
  }
  .stat b{color:#e0564f;font-size:15px}
  .foot .tip{flex:1;min-width:220px}
  a.reset{color:#c98f8f;cursor:pointer;text-decoration:none;border-bottom:1px dashed}
  a.reset:hover{color:#e0564f}

  @media (max-width:760px){
    .topbar{gap:10px;padding:14px}
    .brand h1{font-size:16px}
    .today-card{text-align:left}
    td{height:58px;padding:4px}
    .card .nm{font-size:13px}
    .card .ico{font-size:15px}
    col.time{width:98px}
    .tlab{font-size:12.5px}
  }
</style>
</head>

<script>
"use strict";
/* ============================================================
   7·9班课程表 —— 单文件应用
   数据、配色、日期天气、双击编辑 都在这里
   改课表：直接改 DAYS / ROWS 数组即可
============================================================ */

/* ---------- 1. 基础课表数据（可自行修改） ---------- */
var DAYS = ["礼拜一","礼拜二","礼拜三","礼拜四","礼拜五"];

/* c[0]~c[4] 对应礼拜一~礼拜五，null 表示没课 */

  { t:"8:00 – 8:35",  s:480, e:515, c:["班团队活动","道法","语文","语文","数学"] },
  { t:"8:50 – 9:25",  s:530, e:565, c:["英语","地理","体育","数学","英语"] },
  { t:"10:05 – 10:40",s:605, e:640, c:["英语","生物","英语","英语","语文"] },
  { t:"10:55 – 11:30",s:655, e:690, c:["数学","信息科技","心理/劳动","生物","体育"] },
  { t:"12:15 – 12:40",s:735, e:760, c:["语文","数学","历史","音乐","英语"] },
  { t:"14:00 – 14:35",s:840, e:875, c:["美术","体育","数学","语文","地理"] },
  { t:"14:50 – 15:25",s:890, e:925, c:["体育","语文","数学","数学","道法"] },
  { t:"15:40 – 16:15",s:940, e:975, c:["自习","英语","语文","体育","历史"] },
  { t:"16:25 – 16:55",s:985, e:1015,c:["语/数/英","阳光","语/数/英","阳光","道法/生物"] },
  { t:"17:05 – 17:35",s:1025,e:1055,c:["数学","英语",null,"生物/地理","语文"] },
  { t:"17:45 – 18:15",s:1065,e:1095,c:["数学","英语",null,"地理/历史","语文"] },
];

/* ---------- 2. 科目配色 ---------- */
var SUBJ = {
  "班团队活动":["#FBF0D9","#A97A2E"],
  "语文":["#FBE4E8","#B2576B"],
  "数学":["#DEE9FB","#3D6FB4"],
  "英语":["#DDF2EA","#2E9E7F"],
  "道法":["#EAE3F6","#6B5BA6"],
  "历史":["#F6E8D3","#A8743A"],
  "地理":["#D9EEEE","#2E8B8B"],
  "生物":["#E2F0DA","#4E8C43"],
  "体育":["#FDE9D8","#C2662B"],
  "音乐":["#F7E1EC","#A6587F"],
  "美术":["#FBEBDE","#C07A45"],
  "信息科技":["#E3E6FA","#4A56B5"],
  "心理/劳动":["#E4EDE3","#5F7F5C"],
  "自习":["#EFEDE8","#7C7466"],
  "语/数/英":["#EFEDE8","#8A8177"],
  "阳光":["#DCF1FB","#2E86B8"]
};
var EMO = {
  "班团队活动":"🏫","语文":"📖","数学":"📐","英语":"🗣️","道法":"⚖️",
  "历史":"🏛️","地理":"🗺️","生物":"🌱","体育":"🏀","音乐":"🎵",
  "美术":"🎨","信息科技":"💻","心理/劳动":"🧹","自习":"✏️",
  "语/数/英":"✍️","阳光":"☀️"
};

/* ---------- 3. 持久化（localStorage 不可用则降级为仅本次有效） ---------- */
var STORE_KEY = "kcb_7_9_v1";
function storageOk(){
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
}
function loadGrid(){
  if(!storageOk()) return null;
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    return (obj && obj.g && obj.g.length === ROWS.length) ? obj.g : null;
  }catch(e){ return null; }
}
function saveGrid(g){
  if(!storageOk()) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({v:1, g:g})); }
  catch(e){}
}
function clearSaved(){
  if(!storageOk()) return;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

/* ---------- 4. 渲染 ---------- */
var grid = [];            // grid[row][day] 当前实际数据
function defaultGrid(){
  return ROWS.map(function(r){ return r.c.slice(); });
}

function esc(s){ return s.replace(/[&<>"]/g, function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]; }); }

/* 颜色：整名匹配优先；带“/”的组合课做双色渐变 */
function colorOf(name){
  if(SUBJ[name]) return {bg:SUBJ[name][0], fg:SUBJ[name][1], grad:false};
  var parts = name.split("/").map(function(s){ return s.trim(); });
  if(parts.length > 1 && parts.every(function(p){ return SUBJ[p]; })){
    var a = SUBJ[parts[0]], b = SUBJ[parts[1]];
    return { bg:"linear-gradient(135deg, "+a[0]+" 0%, "+a[0]+" 49%, "+b[0]+" 51%, "+b[0]+" 100%)", fg:"#4a4452", grad:true };
  }
  return { bg:"#EFEDE8", fg:"#7C7466", grad:false };
}

var nowCol = -1;   // 今天是礼拜几(0~4)，周末为 -1
var liveRow = -1;  // 当前正在上课的行
var editing = null;

function renderHeader(){
  var tr = document.getElementById("headRow");
  var h = '<th class="time-cell"><span style="font-size:15px;font-weight:700">时间</span></th>';
  for(var i=0;i<DAYS.length;i++){
    var cls = (i === nowCol) ? "today" : "";
    var pill = (i === nowCol) ? '<span class="pill">今天</span>' : "";
    h += '<th class="'+cls+'">'+DAYS[i]+'<div class="cn">周'+["一","二","三","四","五"][i]+'</div>'+pill+'</th>';
  }
  tr.innerHTML = h;
}

function buildCell(row, day, name){
  var live = (day === nowCol && row === liveRow);
  if(!name){
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "—";
    if(day === nowCol) e.style.background = "repeating-linear-gradient(135deg,#fff6e0 0 6px,#fbf0d4 6px 12px)";
    return e;
  }
  var col = colorOf(name);
  var card = document.createElement("div");
  card.className = "card" + (live ? " live" : "");
  card.title = DAYS[day] + " · " + ROWS[row].t;
  card.style.background = col.bg;
  card.style.color = col.fg;
  var hasEmo = (EMO[name] && name.indexOf("/") < 0);
  var ico = hasEmo ? '<div class="ico">'+EMO[name]+'</div>' : "";
  card.innerHTML = ico + '<div class="nm">'+esc(name)+'</div>';
  if(live){
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = "⏳ 上课中";
    card.appendChild(b);
  }
  card.addEventListener("dblclick", function(ev){
    ev.stopPropagation();
    startEdit(card, row, day);
  });
  return card;
}

function renderBody(){
  var tb = document.getElementById("bodyRows");
  var now = new Date();
  var m = now.getHours()*60 + now.getMinutes();
  if(nowCol >= 0){
    for(var i=0;i<ROWS.length;i++){
      if(m >= ROWS[i].s && m < ROWS[i].e){ liveRow = i; break; }
    }
  }
  var html = "";
  for(var r=0;r<ROWS.length;r++){
    var timeTd = (r === liveRow) ? 'class="time-cell live"' : 'class="time-cell"';
    html += '<tr id="row-'+r+'">';
    html += '<td '+timeTd+'><div class="tlab">'+ROWS[r].t.replace(" – ","<br>")+
            '<small>第'+(r+1)+'节</small></div></td>';
    for(var d=0;d<DAYS.length;d++){
      var bg = (d === nowCol) ? ' style="background:rgba(255,244,214,.5)"' : "";
      html += '<td'+bg+' id="cell-'+r+'-'+d+'"></td>';
    }
    html += "</tr>";
    /* 午间休息：位于第 5 节（12:15–12:40）与第 6 节（14:00–14:35）之间 */
    if(r === 4){
      html += '<tr class="noon"><td class="time-cell noon-t">12:40 – 14:00</td>'+
              '<td colspan="5"><span class="ico">🍱</span>午　间　休　息　·　好好吃饭休息</td></tr>';
    }
  }
  tb.innerHTML = html;

  for(var rr=0;rr<ROWS.length;rr++){
    for(var dd=0;dd<DAYS.length;dd++){
      var cellBox = document.getElementById("cell-"+rr+"-"+dd);
      cellBox.appendChild(buildCell(rr, dd, grid[rr][dd]));
    }
  }
}

/* ---------- 5. 双击编辑 ---------- */
function startEdit(card, row, day){
  if(editing) return;
  var holder = card.parentNode;
  var name = grid[row][day];
  var inp = document.createElement("input");
  inp.className = "ed";
  inp.value = name || "";
  inp.maxLength = 20;
  holder.innerHTML = "";
  holder.appendChild(inp);
  editing = {row:row, day:day, inp:inp};
  inp.focus();
  inp.select();

  function commit(){
    if(!editing) return;
    var v = inp.value.trim();
    editing = null;
    grid[row][day] = v || null;
    saveGrid(grid);
    renderAll(false);
  }
  function cancel(){
    if(!editing) return;
    editing = null;
    renderAll(false);
  }
  inp.addEventListener("keydown", function(ev){
    if(ev.key === "Enter") commit();
    else if(ev.key === "Escape") cancel();
    ev.stopPropagation();
  });
  inp.addEventListener("blur", commit);
}

/* ---------- 6. 顶部信息 ---------- */
function renderDate(){
  var wd = ["日","一","二","三","四","五","六"];
  var now = new Date();
  var y = now.getFullYear(), mo = now.getMonth()+1, da = now.getDate();
  document.getElementById("todayDate").innerHTML =
    y + "年<b>" + mo + "</b>月<b>" + da + "</b>日";
  document.getElementById("todayWeek").innerHTML =
    "星期" + wd[now.getDay()] + " · 看看今天要上什么课";
}

/* ---------- 7. 实时天气（免 Key：IP 定位 + Open-Meteo） ---------- */
var WMO = [
  [0,"晴","☀️"],[1,"晴间多云","🌤️"],[2,"多云","⛅"],[3,"阴","☁️"],
  [45,"雾","🌫️"],[48,"雾凇","🌫️"],
  [51,"毛毛雨","🌦️"],[53,"毛毛雨","🌦️"],[55,"毛毛雨","🌦️"],
  [56,"冻毛毛雨","🌧️"],[57,"冻毛毛雨","🌧️"],
  [61,"小雨","🌧️"],[63,"中雨","🌧️"],[65,"大雨","🌧️"],
  [66,"冻雨","🌧️"],[67,"冻雨","🌧️"],
  [71,"小雪","🌨️"],[73,"中雪","🌨️"],[75,"大雪","❄️"],[77,"雪粒","🌨️"],
  [80,"阵雨","🌦️"],[81,"阵雨","🌧️"],[82,"强阵雨","⛈️"],
  [85,"阵雪","🌨️"],[86,"强阵雪","🌨️"],
  [95,"雷阵雨","⛈️"],[96,"雷雨伴冰雹","⛈️"],[99,"雷雨伴冰雹","⛈️"]
];
function wmoInfo(code){
  for(var i=0;i<WMO.length;i++){ if(WMO[i][0] === code) return WMO[i]; }
  return [code,"天气","🌡️"];
}
function setWeather(city, temp, desc, emoji, hum, hi, lo){
  document.getElementById("wxIco").textContent = emoji || "🌡️";
  document.getElementById("wxTemp").textContent = Math.round(temp);
  var s = desc || "天气";
  if(hi !== undefined && hi !== null){ s += " · 最高"+Math.round(hi)+"° / 最低"+Math.round(lo)+"°"; }
  if(hum !== undefined && hum !== null){ s += " · 湿度"+Math.round(hum)+"%"; }
  document.getElementById("wxDesc").innerHTML = s;
  document.getElementById("wxCity").textContent = city;
}
function renderWeather(city, temp, code, hum, hi, lo){
  var info = wmoInfo(code);
  setWeather(city, temp, info[1], info[2], hum, hi, lo);
}
function wxFail(){
  document.getElementById("wxIco").textContent = "😶";
  document.getElementById("wxTemp").textContent = "--";
  document.getElementById("wxDesc").textContent = "天气暂时获取不到";
  document.getElementById("wxCity").textContent = "点击卡片可重试";
}
function fetchJson(url, ms){
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms || 7000) : null;
  return fetch(url, ctrl ? {signal:ctrl.signal} : {}).then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }).finally(function(){ if(to) clearTimeout(to); });
}
/* 备用天气源：wttr.in（open-meteo 不可达时自动切换） */
function pickEmoji(desc){
  var d = desc || "";
  if(/雷|thunder|storm/i.test(d)) return "⛈️";
  if(/雪|snow/i.test(d)) return "🌨️";
  if(/雨|rain|drizzle|shower/i.test(d)) return "🌧️";
  if(/晴|clear|sun/i.test(d)) return "☀️";
  if(/阴|overcast/i.test(d)) return "☁️";
  if(/多云|partly|cloud/i.test(d)) return "⛅";
  if(/雾|fog|mist|haze/i.test(d)) return "🌫️";
  return "🌡️";
}
async function loadWeatherFromWttr(lat, lon, city){
  var w = await fetchJson("https://wttr.in/"+lat+","+lon+"?format=j1&lang=zh", 9000);
  var cc = w.current_condition && w.current_condition[0];
  if(!cc){ throw new Error("bad wttr"); }
  var desc = "";
  if(cc.lang_zh && cc.lang_zh[0]) desc = cc.lang_zh[0].value;
  else if(cc.weatherDesc && cc.weatherDesc[0]) desc = cc.weatherDesc[0].value;
  var hi = (w.weather && w.weather[0]) ? w.weather[0].maxtempC : null;
  var lo = (w.weather && w.weather[0]) ? w.weather[0].mintempC : null;
  setWeather(city, cc.temp_C, desc, pickEmoji(desc), cc.humidity, hi, lo);
}
async function loadWeather(){
  var lat=null, lon=null, city="";
  try{
    var ip2 = await fetchJson("https://ipwho.is/");
    lat = ip2.latitude; lon = ip2.longitude;
    city = ip2.city || ip2.region || "你所在的城市";
    if(!lat){ throw new Error("no lat"); }
  }catch(e){
    try{
      var ip = await fetchJson("https://ipapi.co/json/");
      lat = ip.latitude; lon = ip.longitude;
      city = (ip.city && ip.city !== "") ? ip.city : (ip.region || "你所在的城市");
      if(!lat){ throw new Error("no lat"); }
    }catch(e2){ wxFail(); return; }
  }
  try{
    var w = await fetchJson("https://api.open-meteo.com/v1/forecast?latitude="+lat+
      "&longitude="+lon+"&current=temperature_2m,relative_humidity_2m,weather_code"+
      "&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1");
    renderWeather(city, w.current.temperature_2m, w.current.weather_code,
      w.current.relative_humidity_2m, w.daily.temperature_2m_max[0], w.daily.temperature_2m_min[0]);
  }catch(e){
    try{ await loadWeatherFromWttr(lat, lon, city); }
    catch(e2){ wxFail(); }
  }
}

/* ---------- 8. 汇总渲染 ---------- */
function renderAll(init){
  var raw = loadGrid();
  grid = raw ? raw : defaultGrid();
  if(!raw && init) saveGrid(grid);

  var gd = new Date().getDay();        // 0 周日 ~ 6 周六
  nowCol = (gd >= 1 && gd <= 5) ? gd-1 : -1;
  liveRow = -1;

  renderHeader();
  renderBody();

  var cnt = 0;
  for(var i=0;i<grid.length;i++) for(var j=0;j<grid[i].length;j++) if(grid[i][j]) cnt++;
  document.getElementById("statCnt").textContent = cnt;

  if(nowCol < 0) document.getElementById("weekendBanner").classList.add("show");
}

/* 日期每天 0 点自动刷新一次 */
function tick(){
  var last = "";
  setInterval(function(){
    var s = new Date().toDateString();
    if(s !== last){ last = s; renderDate(); }
  }, 60000);
}

document.getElementById("resetBtn").addEventListener("click", function(){
  if(confirm("确定把课表恢复成最初的默认内容吗？（你手动改过的课程会被清除）")){
    clearSaved(); renderAll(true); location.reload();
  }
});
document.getElementById("wxCard").addEventListener("click", loadWeather);

renderAll(true);
renderDate();
loadWeather();
tick();
</script>
