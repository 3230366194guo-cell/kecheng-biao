<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>课程表</title>
<style>
  :root{
    --bg:#f4f1ea; --ink:#3f3a45; --muted:#9b93a3; --card:#fff; --line:#e9e4d9;
    --gold:#e9b949; --brand-a:#6c8cff; --brand-b:#63c9a5; --green:#22c55e;
    --shadow:0 10px 30px rgba(90,80,60,.08), 0 2px 6px rgba(90,80,60,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 115% -10%, rgba(108,140,255,.10), transparent 60%),
      radial-gradient(700px 420px at -10% 0%, rgba(99,201,165,.12), transparent 60%),
      var(--bg);
    color:var(--ink); min-height:100vh; padding:24px 18px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1260px;margin:0 auto}

  /* ================= 顶部信息条 ================= */
  .topbar{
    background:rgba(255,255,255,.74); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.9); border-radius:22px; box-shadow:var(--shadow);
    padding:16px 20px; display:flex; flex-direction:column; align-items:center; gap:11px;
    position:relative; overflow:hidden;
  }
  .topbar::after{
    content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(233,185,73,.20), rgba(108,140,255,.10) 60%, transparent 72%);
    pointer-events:none;
  }
  /* 三行居中布局：标题行 / 日期行 / 天气+消息行 */
  .hbrow{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;position:relative;z-index:1}
  .logo{
    width:54px;height:54px;border-radius:50%;flex:none;background:#fff;object-fit:contain;padding:5px;
    box-shadow:0 6px 16px rgba(96,130,220,.28);
  }
  .hbrow h1{
    font-size:23px;letter-spacing:1.5px;line-height:1.3;text-align:center;
    background:linear-gradient(120deg,#5561c8,#3f8f8f 55%,#c89a3c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .dateline{
    position:relative;z-index:1;display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;
    font-size:19px;font-weight:700;
  }
  .dateline .dd{color:#3f3a45}
  .dateline .tt{color:#3f7fdd;font-variant-numeric:tabular-nums;font-size:21px}
  .dateline .ww{color:#8a6d1f}
  .dateline .ll{color:#2e9e7f;font-size:16px}
  .dateline .ll::before{content:"📍";margin-right:3px;font-size:13px}
  .live-now{text-align:center;font-size:12.5px;color:#9b93a3;position:relative;z-index:1}
  .live-now b{color:#16a34a}

  .wxrow{position:relative;z-index:1;display:flex;align-items:stretch;justify-content:center;gap:9px;flex-wrap:wrap}
  .hourly{display:flex;gap:9px}
  /* 当前天气 / 未来整点：完全一致的卡片尺寸（要求4） */
  .wxcur,.hourly .h{
    width:88px;min-height:104px;text-align:center;background:#fff;border:1px solid #e6edfb;border-radius:15px;
    padding:7px 5px 8px;box-shadow:0 3px 8px rgba(90,110,180,.06);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .wxcur{cursor:pointer;transition:transform .15s;background:linear-gradient(180deg,#f4fbf6,#fff);border-color:#bfe7cd}
  .wxcur:hover{transform:translateY(-2px)}
  .wxcur .ht,.hourly .h .ht{font-size:11px;color:#6b7280;white-space:nowrap}
  .wxcur .hi,.hourly .h .hi{font-size:24px;line-height:1.2}
  .wxcur .hh,.hourly .h .hh{font-size:10px;color:#94a3b8;white-space:nowrap}
  .wxcur .hv,.hourly .h .hv{font-size:14px;font-weight:700;color:#334155}
  .hourly .h.now{border-color:#9fd8b4;background:linear-gradient(180deg,#f2fdf6,#fff)}

  /* 查看消息：与天气卡片同宽同高（要求5） */
  .wxmsg{
    width:88px;min-height:104px;border-radius:15px;cursor:pointer;font:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;
    background:linear-gradient(135deg,#eef3ff,#e9f9f2);border:1px solid rgba(120,150,220,.25);
    box-shadow:0 3px 8px rgba(90,110,180,.08);transition:transform .15s, filter .15s;
  }
  .wxmsg:hover{transform:translateY(-2px)}
  .wxmsg .ic{font-size:24px;line-height:1.2}
  .wxmsg .t{font-size:11.5px;color:#4a5f8f;font-weight:700;white-space:nowrap}
  .wxmsg .cnt{
    position:absolute;top:-6px;right:-6px;background:#ff4f6a;color:#fff;font-size:10.5px;
    min-width:17px;height:17px;line-height:17px;border-radius:99px;padding:0 4px;box-shadow:0 2px 6px rgba(255,80,110,.45);
  }
  .wxmsg.flash{animation:msgFlash 1.5s infinite}
  @keyframes msgFlash{
    0%,100%{box-shadow:0 0 0 0 rgba(255,79,106,.55);transform:translateY(0)}
    50%{box-shadow:0 0 0 10px rgba(255,79,106,0);transform:translateY(-2px)}
  }

  .btn{
    border:none;cursor:pointer;font:inherit;font-weight:700;color:#fff;border-radius:14px;
    padding:9px 16px;background:linear-gradient(135deg,#7b95ff,#5fbf9b);
    box-shadow:0 6px 14px rgba(96,130,220,.28); transition:transform .14s, filter .14s; white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px);filter:saturate(1.08)}
  .btn.ghost{background:#fff;color:#5b6b8c;border:1px solid #dde5f5;box-shadow:0 3px 8px rgba(90,110,180,.08)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
  .btn.danger{background:linear-gradient(135deg,#ff8f8f,#e8607a);box-shadow:0 6px 14px rgba(230,96,122,.28)}

  .weekend-banner{
    display:none;margin-top:16px;text-align:center;
    background:linear-gradient(90deg,#fff7e0,#fff1f2,#eef6ff);
    border:1px dashed var(--gold);border-radius:16px;padding:12px;font-size:15px;color:#8a6d1f;letter-spacing:1px;
  }
  .weekend-banner.show{display:block}

  /* ================= 课表 ================= */
  .board{
    margin-top:16px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.85);overflow:hidden;
  }
  table.sch{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  col.time{width:142px}
  th{
    padding:15px 6px;background:#fbf9f4;font-size:17px;letter-spacing:2px;color:#57525f;
    border-bottom:2px solid var(--line);position:relative;
  }
  th.today{background:linear-gradient(180deg,#fff4d8,#fffaf0)}
  th .pill{
    position:absolute;top:9px;right:10px;font-size:10.5px;line-height:1;
    background:linear-gradient(120deg,#ff9d6c,#ff5f6d);color:#fff;padding:3.5px 8px;border-radius:99px;
    box-shadow:0 3px 8px rgba(255,95,109,.35);letter-spacing:0;
  }
  td{
    border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    padding:7px;height:70px;vertical-align:middle;transition:background .3s;
  }
  td.time-cell{background:#faf8f2;text-align:center;width:142px}
  tr:last-child td{border-bottom:none}
  td:last-child{border-right:none}

  .tlab{font-size:15.5px;font-weight:700;color:#57525f;white-space:nowrap}
  .tlab small{display:block;font-size:11px;color:#a99fb3;font-weight:400;margin-top:4px;letter-spacing:2px}
  td.live .tlab{color:#15803d}
  td.live .tlab small{color:#22c55e;font-weight:700}
  .now-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;
    vertical-align:1px;animation:dotPulse 1.4s infinite;
  }
  @keyframes dotPulse{50%{opacity:.3;transform:scale(.8)}}

  .cell{height:100%;position:relative}
  .card{
    height:100%;border-radius:14px;padding:7px 8px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    transition:transform .16s ease, box-shadow .16s ease; text-align:center;user-select:none;overflow:hidden;
  }
  .card .ico{font-size:19px;line-height:1}
  .card .nm{font-size:17px;font-weight:700;line-height:1.22;word-break:break-all}
  .card:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 16px rgba(90,80,60,.14)}
  /* 当前正在上的课：绿色脉动光晕（要求5） */
  .cell.live .card,td.live .card{animation:glowPulse 1.8s ease-in-out infinite;outline:2px solid rgba(34,197,94,.85);outline-offset:-2px}
  @keyframes glowPulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.65), 0 6px 16px rgba(34,197,94,.35)}
    70%{box-shadow:0 0 0 14px rgba(34,197,94,0), 0 6px 16px rgba(34,197,94,.18)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0), 0 6px 16px rgba(34,197,94,.35)}
  }
  .empty{
    height:100%;border-radius:14px;background:repeating-linear-gradient(135deg,#faf8f2 0 6px,#f6f3ea 6px 12px);
    display:flex;align-items:center;justify-content:center;color:#d6cfc0;font-size:16px;letter-spacing:2px;
  }
  .ed{width:100%;height:100%;border:2px solid #6c8cff;border-radius:10px;font:inherit;font-size:15px;text-align:center;padding:4px;background:#fff;outline:none}

  tr.noon td{
    background:linear-gradient(90deg, transparent, rgba(233,185,73,.05) 30%, rgba(233,185,73,.05) 70%, transparent);
    border-top:2px dashed #e8d9b0;border-bottom:2px dashed #e8d9b0;
    height:38px;text-align:center;color:#a08a5a;letter-spacing:8px;font-size:14.5px;
  }
  tr.noon .noon-t{letter-spacing:1px;color:#b3a887;font-size:12.5px;background:transparent;font-weight:600}
  tr.noon td .ico{font-size:15px;margin-right:6px;letter-spacing:0}

  /* ================= 页脚（设置按钮在最底部、退出登录前边） ================= */
  .foot{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;display:inline-flex;gap:6px;align-items:center;box-shadow:0 3px 8px rgba(90,80,60,.06)}
  .stat b{color:#e0564f;font-size:15px}
  a.link{color:#c98f8f;cursor:pointer;text-decoration:none;border-bottom:1px dashed}
  a.link:hover{color:#e0564f}

  /* ================= 弹窗 / 表单 ================= */
  .mask{position:fixed;inset:0;background:rgba(40,38,50,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:960px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(50,40,70,.28);padding:18px 20px 20px}
  .modal.narrow{max-width:430px}
  .mtitle{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mtitle h3{font-size:18px;color:#45405a;letter-spacing:.5px}
  .mtitle .x{margin-left:auto;cursor:pointer;color:#b7b0c4;font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
  .mtitle .x:hover{background:#f4f2f8;color:#7b7390}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
  .tab{padding:8px 14px;border-radius:11px;cursor:pointer;font-size:14px;color:#6b6480;background:#f7f6fa;border:1px solid transparent}
  .tab.on{background:linear-gradient(135deg,#eef3ff,#e9f9f2);color:#4a5f8f;border-color:#dbe6fb;font-weight:700}
  .pane{display:none}
  .pane.on{display:block}
  .frm{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center;max-width:660px}
  .frm label{font-size:13.5px;color:#6b6480;text-align:right}
  .in{width:100%;padding:8px 11px;border:1px solid #dcd8e6;border-radius:11px;font:inherit;font-size:14px;background:#fff;outline:none}
  .in:focus{border-color:#9db2ff;box-shadow:0 0 0 3px rgba(108,140,255,.14)}
  textarea.in{min-height:78px;resize:vertical}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hint{font-size:12px;color:#a49cb2;line-height:1.6}
  .sect{margin:16px 0 8px;font-size:14px;font-weight:700;color:#57526b;display:flex;align-items:center;gap:8px}
  .sect::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,#7b95ff,#5fbf9b)}
  table.grid{width:100%;border-collapse:collapse;font-size:13px}
  table.grid th,table.grid td{border:1px solid var(--line);padding:4px;text-align:center}
  table.grid th{background:#fbf9f4;font-size:12.5px;letter-spacing:1px}
  table.grid input{width:100%;border:1px solid transparent;background:transparent;font:inherit;font-size:13px;text-align:center;padding:4px;border-radius:7px;outline:none}
  table.grid input:focus{border-color:#9db2ff;background:#fff}
  table.grid input.tm{max-width:62px}
  table.list{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  table.list th,table.list td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
  table.list th{color:#8d86a0;font-weight:600;font-size:12.5px}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#eef3ff;color:#4a5f8f}
  .tag.pin{background:#fff2d8;color:#a97a2e}
  .tag.admin{background:#efe6fb;color:#6b5ba6}
  .msgitem{border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;background:#fff}
  .msgitem.pinned{background:linear-gradient(135deg,#fffaee,#fffdf8);border-color:#f0dfb6}
  .msgitem .h{display:flex;gap:8px;align-items:center;font-size:12px;color:#9b93a3;margin-bottom:5px;flex-wrap:wrap}
  .msgitem .c{font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .msgitem .ops{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  /* 消息附件（图片 / 文档） */
  .atts{margin-top:9px;display:flex;flex-wrap:wrap;gap:9px}
  .atts img{max-width:220px;max-height:220px;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
  .attdoc{
    display:inline-flex;align-items:center;gap:7px;background:#f7f9ff;border:1px solid #e3eaf9;border-radius:11px;
    padding:7px 11px;font-size:12.5px;color:#4a5f8f;text-decoration:none;max-width:100%;
  }
  .attdoc:hover{background:#eef3ff}
  .attdoc small{color:#9aa6bd}
  .chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:#f7f9ff;border:1px solid #e3eaf9;border-radius:11px;
    padding:5px 9px;font-size:12px;color:#4a5f8f;max-width:100%;
  }
  .chip .x{cursor:pointer;color:#c08f9a;font-weight:700}
  .chip img{width:26px;height:26px;object-fit:cover;border-radius:6px}
  .paste-zone{
    border:1px dashed #cfd8ee;border-radius:12px;padding:8px 10px;font-size:12px;color:#9aa6bd;background:#fbfcff;
  }
  /* 学校 / 班级 层级列表 */
  .tree{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tree .srow{display:flex;align-items:center;gap:9px;background:#f7f9ff;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;color:#4a5f8f}
  .tree .srow .em{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:contain;border:1px solid #e3eaf9}
  .tree .srow .meta{margin-left:auto;font-weight:400;font-size:12px;color:#9aa6bd}
  .tree .crow{display:flex;align-items:center;gap:9px;padding:8px 12px 8px 34px;border-bottom:1px solid #f1eee7;font-size:13.5px;color:#57526b}
  .tree .crow::before{content:"└";color:#c9c3d6;margin-right:2px}
  .tree .crow:last-child{border-bottom:none}
  .tree .crow .meta{margin-left:auto;font-size:12px;color:#9aa6bd}
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(52,48,66,.94);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .hbrow h1{font-size:18px}
    .dateline{font-size:16px;gap:9px}
    .dateline .tt{font-size:18px}
    .wxcur,.hourly .h,.wxmsg{width:70px;min-height:96px}
    .wxcur .hi,.hourly .h .hi,.wxmsg .ic{font-size:19px}
  }
  @media (max-width:700px){
    body{padding:14px 10px 30px}
    td{height:60px;padding:4px}
    .card .nm{font-size:13.5px}
    .card .ico{font-size:15px}
    col.time{width:100px}
    th{font-size:14px;letter-spacing:1px}
    .tlab{font-size:13px}
    .tlab small{font-size:10px;letter-spacing:1px}
    .hbrow h1{font-size:16px}
    .logo{width:44px;height:44px}
    .wxcur,.hourly .h,.wxmsg{width:62px;min-height:88px}
    .wxcur .ht,.hourly .h .ht{font-size:10px}
    .wxcur .hh,.hourly .h .hh{font-size:9.5px}
    .wxmsg .t{font-size:10px}
    .frm{grid-template-columns:1fr}
    .frm label{text-align:left}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <!-- 第 1 行：校徽 + 标题（居中） -->
    <div class="hbrow">
      <img class="logo" id="schoolLogo" src="" alt="校徽">
      <h1 id="schoolTitle">课程表</h1>
    </div>

    <!-- 第 2 行：日期 时间 星期 定位（居中） -->
    <div class="dateline">
      <span class="dd" id="dDate">——</span>
      <span class="tt" id="dTime">--:--</span>
      <span class="ww" id="dWeek">——</span>
      <span class="ll" id="dLoc">——</span>
    </div>

    <div class="live-now" id="liveNow"></div>

    <!-- 第 3 行：当前天气 + 未来四个整点 + 查看消息（同高同宽风格） -->
    <div class="wxrow">
      <div class="wxcur" id="wxCard" title="点击切换天气城市（当前天气）">
        <div class="ht">当前天气</div>
        <div class="hi" id="wxIco">⛅</div>
        <div class="hh" id="wxHum">正在获取…</div>
        <div class="hv"><span id="wxTemp">--</span>℃</div>
      </div>
      <div class="hourly" id="hourly"></div>
      <button class="wxmsg" id="msgBtn" title="查看消息">
        <span class="ic">📢</span>
        <span class="t">查看消息</span>
        <span class="cnt" id="msgCnt" style="display:none">0</span>
      </button>
    </div>
  </header>

  <div class="weekend-banner" id="weekendBanner">🎉 今天是周末，没有课，好好休息放松一下吧！</div>

  <section class="board">
    <table class="sch">
      <colgroup><col class="time"></colgroup>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </section>

  <footer class="foot">
    <div class="stat">📆 本周课程 <b id="statCnt">0</b> 节</div>
    <span id="syncState" class="hint">云端 · 未登录</span>
    <button class="btn ghost" id="setBtn">⚙️ 设置</button>
    <a class="link" id="logoutLink" style="display:none">退出登录</a>
  </footer>
</div>

<div class="mask" id="maskLogin">
  <div class="modal narrow">
    <div class="mtitle"><h3>🔐 登录</h3><span class="x" data-close="maskLogin">✕</span></div>
    <div class="frm">
      <label>用户名</label><input class="in" id="lgUser" autocomplete="username">
      <label>密码</label><input class="in" type="password" id="lgPass" autocomplete="current-password">
    </div>
    <div class="hint" style="margin-top:10px">默认管理员：admin / admin123　　默认普通用户：jiazhang / 123456（登录后请及时修改密码）</div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="lgBtn">登录</button>
      <button class="btn ghost" data-close="maskLogin">取消</button>
    </div>
  </div>
</div>

<div class="mask" id="maskAdmin">
  <div class="modal">
    <div class="mtitle"><h3>⚙️ 设置 · 后台管理</h3><span class="x" data-close="maskAdmin">✕</span></div>
    <div class="tabs" id="adminTabs"></div>

function cloudEnabled(){ return !!(CLOUD.url && CLOUD.key); }
function cloudOn(){ return cloudEnabled() && !!CLOUD.token; }
function cloudErrText(payload){
  var m = String((payload && (payload.message || payload.error_description || payload.error)) || "");
  var map = {
    AUTH_FAILED:"用户名或密码不正确", NO_TOKEN:"请先登录", BAD_TOKEN:"登录已过期，请重新登录",
    NO_PERMISSION:"当前账号没有权限执行该操作", KEEP_ONE_SCHOOL:"至少要保留一所学校",
    CANNOT_DELETE_SELF:"不能删除当前登录的账号", OLD_PASSWORD_WRONG:"原密码不正确",
    PASSWORD_TOO_SHORT:"新密码至少 4 位", NOT_FOUND:"数据不存在"
  };
  for(var k in map){ if(m.indexOf(k) >= 0) return map[k]; }
  return m || "云端操作失败";
}
async function cloudRpc(name, args, ms){
  if(!cloudEnabled()) throw new Error("未配置云端");
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms || 15000) : null;
  try{
    var res = await fetch(CLOUD.url + "/rest/v1/rpc/" + name, {
      method:"POST",
      headers:{ apikey:CLOUD.key, Authorization:"Bearer " + CLOUD.key, "Content-Type":"application/json" },
      body: JSON.stringify(args || {}),
      signal: ctrl ? ctrl.signal : undefined
    });
    var txt = await res.text();
    if(!res.ok){
      var obj = null; try{ obj = JSON.parse(txt); }catch(e){}
      throw new Error(cloudErrText(obj || { message:txt }));
    }
    CLOUD.online = true; CLOUD.lastSync = Date.now();
    return txt ? JSON.parse(txt) : null;
  }finally{ if(to) clearTimeout(to); }
}
/* 上传附件到云端对象存储，返回 {path,url}
   注意：对象 key 必须是 ASCII（中文名会保留在消息元数据里用于显示） */
async function cloudUploadAtt(att, classId){
  var ext = (String(att.name || "").match(/\.[A-Za-z0-9]{1,6}$/) || [""])[0];
  var rand = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  var path = (classId || "c1") + "/" + rand + ext;
  var base64 = String(att.data || "").split(",")[1] || "";
  var bin = atob(base64);
  var u8 = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  var res = await fetch(CLOUD.url + "/storage/v1/object/attachments/" + path, {
    method:"POST",
    headers:{
      apikey:CLOUD.key, Authorization:"Bearer " + CLOUD.key,
      "x-session-token":CLOUD.token, "Content-Type":att.type || "application/octet-stream"
    },
    body: u8
  });
  if(!res.ok){ var t = await res.text(); throw new Error("附件上传失败：" + t.slice(0,120)); }
  return { path: path, url: CLOUD.url + "/storage/v1/object/public/attachments/" + path };
}
/* 把云端返回的数据套用到本地模型（字段名由 snake_case 归一为 camelCase） */
function applyCloud(d){
  if(!d) return;
  if(d.me){ CLOUD.userId = d.me.id; }
  data.schools = (d.schools || []).map(function(s){
    return { id:s.id, name:s.name, emblem:s.emblem || DEFAULT_EMBLEM, location:s.location || "", lat:s.lat, lon:s.lon };
  });
  data.classes = (d.classes || []).map(function(c){ return { id:c.id, schoolId:c.school_id, name:c.name }; });
  data.users = (d.users || []).map(function(u){
    return { id:u.id, username:u.username, name:u.name || "", schoolId:u.school_id, classId:u.class_id,
             duty:u.duty || "", gender:u.gender || "保密", phone:u.phone || "", role:u.role || "user" };
  });
  var ttObj = {};
  for(var k in (d.timetables || {})){
    var t = d.timetables[k];
    ttObj[k] = { periods:t.periods || [], grid:t.grid || [], lunch:t.lunch || {s:"12:40",e:"14:00"} };
  }
  data.timetables = ttObj;
  data.messages = (d.messages || []).map(function(m){
    return { id:m.id, classId:m.class_id, date:m.date, content:m.content || "", pinned:!!m.pinned,
             author:m.author || "", attachments:m.attachments || [], createdAt:m.created_at_ms };
  });
  data.defaultSchoolId = data.schools.length ? data.schools[0].id : null;
  data.defaultClassId = data.classes.length ? data.classes[0].id : null;
  data.session = CLOUD.userId;
  saveData();
}
async function cloudRefresh(){
  if(!cloudOn()) return false;
  try{
    var d = await cloudRpc("api_bootstrap", { p_token: CLOUD.token });
    applyCloud(d);
    renderSyncState();
    return true;
  }catch(e){
    CLOUD.online = false;
    renderSyncState();
    if(String(e.message).indexOf("登录已过期") >= 0){ CLOUD.token = null; storeToken(null); }
    return false;
  }
}
function storeToken(t){ try{ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
function renderSyncState(){
  var el = $("syncState");
  if(!el) return;
  if(!cloudEnabled()){ el.textContent = "本机版"; el.style.color = "#a49cb2"; return; }
  if(!cloudOn()){ el.textContent = "云端 · 未登录"; el.style.color = "#a49cb2"; return; }
  if(CLOUD.online){
    var t = CLOUD.lastSync ? new Date(CLOUD.lastSync) : null;
    el.textContent = "云端已同步" + (t ? " " + pad(t.getHours()) + ":" + pad(t.getMinutes()) : "");
    el.style.color = "#2e9e7f";
  }else{
    el.textContent = "离线 · 显示本机缓存";
    el.style.color = "#e0564f";
  }
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t.__tm); t.__tm = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function hm2min(s){
  var m = /^(\d{1,2})\s*[:：]\s*(\d{1,2})$/.exec(String(s||"").trim());
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function pad(n){ return (n<10?"0":"") + n; }
function todayStr(d){
  d = d || new Date();

async function sha256hex(str){
  try{
    if(window.crypto && crypto.subtle){
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    }
  }catch(e){}
  var h = 5381;
  for(var i=0;i<str.length;i++){ h = ((h<<5)+h+str.charCodeAt(i)) >>> 0; }
  return "weak:" + h.toString(16) + ":" + str.length;
}
async function hashPass(username, pass){ return await sha256hex("kcb::" + username + "::" + pass); }

function colorOf(name){
  if(SUBJ[name]) return { bg:SUBJ[name][0], fg:SUBJ[name][1] };
  var parts = String(name).split("/").map(function(s){ return s.trim(); });
  if(parts.length > 1 && SUBJ[parts[0]] && SUBJ[parts[1]]){
    var a = SUBJ[parts[0]], b = SUBJ[parts[1]];
    return { bg:"linear-gradient(135deg, "+a[0]+" 0%, "+a[0]+" 49%, "+b[0]+" 51%, "+b[0]+" 100%)", fg:"#4a4452" };
  }
  return { bg:"#EFEDE8", fg:"#7C7466" };
}
function liveInfo(){
  var cid = viewClassId();
  if(!cid) return { col:-1, row:-1, period:null, subject:null };
  var d = nowInfo(), col = d.getDay() - 1;
  if(col < 0 || col > 4) return { col:-1, row:-1, period:null, subject:null };
  var m = d.getHours()*60 + d.getMinutes(), t = tt(cid);
  for(var i=0;i<t.periods.length;i++){
    var s = hm2min(t.periods[i].s), e = hm2min(t.periods[i].e);
    if(s != null && e != null && m >= s && m < e) return { col:col, row:i, period:t.periods[i], subject:(t.grid[i] ? t.grid[i][col] : null) };
  }
  return { col:col, row:-1, period:null, subject:null };
}
function renderLiveNow(){
  var li = liveInfo(), box = $("liveNow");
  if(li.col < 0){ box.textContent = ""; return; }
  if(li.row >= 0 && li.subject){
    box.innerHTML = "● 正在上课：<b>第" + (li.row+1) + "节 · " + esc(li.subject) + "</b>（" + li.period.s + " – " + li.period.e + "）";
    return;
  }
  var cid = viewClassId(), t = tt(cid), d = nowInfo(), m = d.getHours()*60 + d.getMinutes(), nxt = null;
  for(var i=0;i<t.periods.length;i++){
    var s = hm2min(t.periods[i].s);
    if(s != null && s > m){ nxt = { i:i, p:t.periods[i], sub:(t.grid[i] ? t.grid[i][li.col] : null) }; break; }
  }
  box.innerHTML = (nxt && nxt.sub)
    ? "下一节：第" + (nxt.i+1) + "节 · " + esc(nxt.sub) + "（" + nxt.p.s + " 开始）"
    : "现在没有课，好好休息～";
}
function renderTable(){
  var cid = viewClassId();
  if(!cid){ $("headRow").innerHTML = "<th>暂无班级</th>"; $("bodyRows").innerHTML = ""; return; }
  var t = tt(cid), li = liveInfo();

  var h = '<th class="time-cell"><span style="font-size:15px;font-weight:700">时间</span></th>';

  }
  $("headRow").innerHTML = h;

  var html = "";
  for(var r=0;r<t.periods.length;r++){
    var isLiveRow = (r === li.row && li.col >= 0);
    html += '<tr id="row-' + r + '">';
    html += '<td class="time-cell' + (isLiveRow ? " live" : "") + '"><div class="tlab">' +
            (isLiveRow ? '<span class="now-dot"></span>' : '') +
            t.periods[r].s + " – " + t.periods[r].e + '<small>第' + (r+1) + '节</small></div></td>';
    for(var d=0;d<DAYS.length;d++){
      var isLiveCell = (r === li.row && d === li.col);
      var bg = (d === todayCol && !isLiveCell) ? ' style="background:rgba(255,244,214,.5)"' : "";
      html += '<td class="' + (isLiveCell ? "live" : "") + '"' + bg + ' id="cell-' + r + '-' + d + '"></td>';
    }
    html += '</tr>';
    if(r === 4){
      html += '<tr class="noon"><td class="time-cell noon-t">' + t.lunch.s + " – " + t.lunch.e + '</td>' +
              '<td colspan="5"><span class="ico">🍱</span>午　间　休　息</td></tr>';
    }
  }
  $("bodyRows").innerHTML = html;

  var cnt = 0;
  for(var rr=0;rr<t.grid.length;rr++){
    for(var dd=0;dd<DAYS.length;dd++){
      var box = $("cell-" + rr + "-" + dd);
      if(!box) continue;
      var name = t.grid[rr] ? t.grid[rr][dd] : null;
      if(name) cnt++;
      box.appendChild(buildCell(rr, dd, name, li));
    }

  $("statCnt").textContent = cnt;

}
function buildCell(row, col, name, li){
  if(!name){
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "—";
    return e;
  }
  var c = colorOf(name);
  var card = document.createElement("div");
  card.className = "card";
  card.style.background = c.bg;
  card.style.color = c.fg;
  card.title = DAYS[col] + " · 第" + (row+1) + "节（登录后双击可修改）";
  var hasEmo = (EMO[name] && name.indexOf("/") < 0);
  card.innerHTML = (hasEmo ? '<div class="ico">' + EMO[name] + '</div>' : '') + '<div class="nm">' + esc(name) + '</div>';
  card.addEventListener("dblclick", function(){
    if(!canEditClass(viewClassId())){ toast("请先登录后再修改课程"); return; }
    startEdit(card, row, col);
  });
  return card;
}
var editing = null;
function startEdit(card, row, col){
  if(editing) return;
  var cid = viewClassId(), holder = card.parentNode, t = tt(cid);
  var inp = document.createElement("input");
  inp.className = "ed";
  inp.value = (t.grid[row] && t.grid[row][col]) || "";
  inp.maxLength = 24;
  holder.innerHTML = ""; holder.appendChild(inp);
  editing = { row:row, col:col, inp:inp, cid:cid };
  inp.focus(); inp.select();
  inp.addEventListener("keydown", function(ev){
    if(ev.key === "Enter") commitEdit();
    else if(ev.key === "Escape"){ editing = null; renderTable(); }
    ev.stopPropagation();
  });
  inp.addEventListener("blur", commitEdit);
}
function commitEdit(){
  if(!editing) return;
  var st = editing; editing = null;
  var v = st.inp.value.trim(), t = tt(st.cid);
  if(!t.grid[st.row]) t.grid[st.row] = [];
  t.grid[st.row][st.col] = v || null;
  saveData(); renderTable(); renderLiveNow();
  toast(v ? "已保存：" + v : "已清空该格");
}

function periodName(h){

  if(h < 13) return "中午";

}
function h12(h){ var x = h % 12; return x === 0 ? 12 : x; }
var WMO = [
  [0,"晴","☀️"],[1,"晴间多云","🌤️"],[2,"多云","⛅"],[3,"阴","☁️"],[45,"雾","🌫️"],[48,"雾凇","🌫️"],
  [51,"毛毛雨","🌦️"],[53,"毛毛雨","🌦️"],[55,"毛毛雨","🌦️"],[56,"冻毛毛雨","🌧️"],[57,"冻毛毛雨","🌧️"],
  [61,"小雨","🌧️"],[63,"中雨","🌧️"],[65,"大雨","🌧️"],[66,"冻雨","🌧️"],[67,"冻雨","🌧️"],
  [71,"小雪","🌨️"],[73,"中雪","🌨️"],[75,"大雪","❄️"],[77,"雪粒","🌨️"],
  [80,"阵雨","🌦️"],[81,"阵雨","🌧️"],[82,"强阵雨","⛈️"],[85,"阵雪","🌨️"],[86,"强阵雪","🌨️"],
  [95,"雷阵雨","⛈️"],[96,"雷雨伴冰雹","⛈️"],[99,"雷雨伴冰雹","⛈️"]
];
function wmoInfo(code){
  for(var i=0;i<WMO.length;i++){ if(WMO[i][0] === code) return WMO[i]; }
  return [code,"天气","🌡️"];
}
function pickEmoji(desc){
  var d = desc || "";
  if(/雷|thunder|storm/i.test(d)) return "⛈️";
  if(/雪|snow/i.test(d)) return "🌨️";
  if(/雨|rain|drizzle|shower/i.test(d)) return "🌧️";
  if(/晴|clear|sun/i.test(d)) return "☀️";
  if(/阴|overcast/i.test(d)) return "☁️";
  if(/多云|partly|cloud/i.test(d)) return "⛅";
  if(/雾|fog|mist|haze/i.test(d)) return "🌫️";
  return "🌡️";
}
function fetchJson(url, ms){
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, ms || 8000) : null;
  return fetch(url, ctrl ? {signal:ctrl.signal} : {}).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }).finally(function(){ if(to) clearTimeout(to); });
}
function renderHourly(list){
  var h = "";

    var it = list[i];
    h += '<div class="h"><div class="ht">' + periodName(it.hour) + h12(it.hour) + ':00</div>' +
         '<div class="hi">' + it.icon + '</div>' +
         '<div class="hh">湿度 ' + (it.hum == null ? "--" : Math.round(it.hum)) + '%</div>' +
         '<div class="hv">' + (it.temp == null ? "--" : Math.round(it.temp)) + '℃</div></div>';
  }
  $("hourly").innerHTML = h;
}
function setCurrent(temp, code, desc, icon, hum){

  $("wxIco").textContent = icon || (code != null ? wmoInfo(code)[2] : "🌡️");
  var s = desc || (code != null ? wmoInfo(code)[1] : "天气");

async function loadWeather(){
  $("wxHum").textContent = "正在获取…";
  var s = currentSchool();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + s.lat + "&longitude=" + s.lon +
    "&current=temperature_2m,relative_humidity_2m,weather_code" +
    "&hourly=temperature_2m,relative_humidity_2m,weather_code&timezone=auto&forecast_days=2";
  try{
    var w = await fetchJson(url);
    setCurrent(w.current.temperature_2m, w.current.weather_code, null, null, w.current.relative_humidity_2m);
    var now = new Date(), list = [], ht = w.hourly.time;
    for(var i=0;i<ht.length && list.length<4;i++){
      var dt = new Date(ht[i].replace(" ", "T"));
      if(dt.getMinutes() !== 0 || dt.getTime() <= now.getTime()) continue;
      list.push({
        hour: dt.getHours(), temp: w.hourly.temperature_2m[i], hum: w.hourly.relative_humidity_2m[i],
        icon: wmoInfo(w.hourly.weather_code[i])[2]
      });

async function loadWeatherWttr(){
  var s = currentSchool();
  var w = await fetchJson("https://wttr.in/" + s.lat + "," + s.lon + "?format=j1&lang=zh", 9000);
  var cc = w.current_condition && w.current_condition[0];
  if(!cc) throw new Error("bad wttr");
  var d0 = (cc.lang_zh && cc.lang_zh[0]) ? cc.lang_zh[0].value : ((cc.weatherDesc && cc.weatherDesc[0]) ? cc.weatherDesc[0].value : "");
  setCurrent(cc.temp_C, null, d0, pickEmoji(d0), cc.humidity);
  var nowH = new Date().getHours(), list = [], days = w.weather || [];
  for(var di=0; di<days.length && list.length<4; di++){
    var hs = days[di].hourly || [];
    for(var hi=0; hi<hs.length && list.length<4; hi++){
      var hh = parseInt(hs[hi].time,10) / 100;

async function geocodeCity(name){
  try{
    var g = await fetchJson("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=1&language=zh&format=json");
    if(g && g.results && g.results[0]) return { lat:g.results[0].latitude, lon:g.results[0].longitude };
  }catch(e){}
  try{
    var n = await fetchJson("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(name + " 中国"));
    if(n && n[0]) return { lat:parseFloat(n[0].lat), lon:parseFloat(n[0].lon) };
  }catch(e){}

/* ---- 附件：图片 / 文档（本机存储，图片自动压缩；支持选择与粘贴） ---- */
var ATT_LIMIT = 1.6 * 1024 * 1024;     /* 单个附件上限 1.6MB */
var MSG_ATT_TOTAL = 3 * 1024 * 1024;   /* 单条消息附件总上限 3MB */
function fmtSize(b){
  b = b || 0;
  if(b < 1024) return b + "B";
  if(b < 1048576) return Math.round(b/1024) + "KB";
  return (b/1048576).toFixed(2) + "MB";
}
function isImgAtt(type, name){
  return /^image\//.test(type || "") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(name || "");
}
function readAttachment(file, cb){
  if(!file) return;
  if(file.size > ATT_LIMIT){ toast("附件太大（单个上限 1.6MB）：" + file.name); return; }
  var isImg = isImgAtt(file.type, file.name);
  var fr = new FileReader();
  fr.onload = function(){
    var raw = { name:file.name || "附件", type:file.type || "file", size:file.size || 0, data:fr.result, img:false };
    if(!isImg){ cb(raw); return; }
    var img = new Image();
    img.onload = function(){
      try{
        var max = 1400, w = img.width, h = img.height;
        if(w > max || h > max){ var k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        var out = cv.toDataURL("image/jpeg", 0.75);
        cb({ name:(file.name || "粘贴的图片") + (/(\.jpg|\.jpeg|\.png|\.webp|\.gif)$/i.test(file.name||"") ? "" : ".jpg"),
             type:"image/jpeg", size:Math.round(out.length * 0.75), data:out, img:true });
      }catch(e){ cb(raw); }
    };
    img.onerror = function(){ cb(raw); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function attSumSize(list){ var s = 0; for(var i=0;i<list.length;i++){ s += (list[i].size || 0); } return s; }
/* 附件地址：本机模式用 base64，云端模式用对象存储公开地址 */
function attSrc(a){
  if(a.path) return CLOUD.url + "/storage/v1/object/public/attachments/" + a.path;
  return a.data || "";
}
function renderAtts(atts){
  if(!atts || !atts.length) return "";
  var h = '<div class="atts">';
  for(var i=0;i<atts.length;i++){
    var a = atts[i], src = attSrc(a);
    if(a.img) h += '<a href="' + src + '" target="_blank" title="点击查看大图：' + esc(a.name) + '"><img src="' + src + '" alt="' + esc(a.name) + '"></a>';
    else h += '<a class="attdoc" href="' + src + '" download="' + esc(a.name) + '">📄 <span>' + esc(a.name) + '</span> <small>' + fmtSize(a.size) + '</small></a>';
  }
  return h + '</div>';
}
function attachBoxHtml(prefix){
  return '<label>附件</label><div>' +
    '<div class="row"><label class="btn sm ghost" style="cursor:pointer">📎 选择图片 / 文档' +
      '<input type="file" id="' + prefix + 'File" multiple style="display:none"></label>' +
    '<span class="hint">支持 Word/PDF/图片等各类文件；也可在内容框里直接 Ctrl+V 粘贴截图（图片自动压缩，单个 ≤1.6MB）</span></div>' +
    '<div class="chips" id="' + prefix + 'Chips"></div></div>';
}
function renderChips(prefix, list){
  var box = $(prefix + "Chips");
  if(!box) return;
  box.innerHTML = list.map(function(a, i){
    return '<span class="chip">' + (a.img ? '<img src="' + a.data + '" alt="">' : "📄") + esc(a.name) +
           ' <small style="color:#9aa6bd">' + fmtSize(a.size) + '</small>' +
           '<span class="x" data-rm="' + i + '">✕</span></span>';
  }).join("");
  Array.prototype.forEach.call(box.querySelectorAll("[data-rm]"), function(el){
    el.addEventListener("click", function(){ list.splice(+el.getAttribute("data-rm"), 1); renderChips(prefix, list); });
  });
}
function addFiles(files, prefix, list){
  Array.prototype.forEach.call(files || [], function(f){
    readAttachment(f, function(att){
      if(attSumSize(list) + (att.size || 0) > MSG_ATT_TOTAL){ toast("本条消息附件总大小超过 3MB，请精简后再试"); return; }
      list.push(att); renderChips(prefix, list);
    });
  });
}
function bindAttach(prefix, list){
  var inp = $(prefix + "File");
  if(inp) inp.addEventListener("change", function(ev){ addFiles(ev.target.files, prefix, list); ev.target.value = ""; });
  var ta = $(prefix + "Text");
  if(ta) ta.addEventListener("paste", function(ev){
    var items = (ev.clipboardData && ev.clipboardData.items) || [], files = [];
    for(var i=0;i<items.length;i++){
      if(items[i].kind === "file"){ var f = items[i].getAsFile(); if(f) files.push(f); }
    }
    if(files.length){ ev.preventDefault(); addFiles(files, prefix, list); toast("已添加粘贴的截图"); }
  });
}
function msgItemHtml(m, editable){

function bindMsgOps(scope, after){
  Array.prototype.forEach.call(scope.querySelectorAll("[data-op]"), function(el){
    el.addEventListener("click", async function(){

        try{
          if(op === "pin") await cloudRpc("api_pin_message", { p_token:CLOUD.token, p_id:id, p_pinned: !m.pinned });
          else if(op === "del"){
            if(!confirm("确定删除这条消息？")) return;
            await cloudRpc("api_delete_message", { p_token:CLOUD.token, p_id:id });
          }
          await cloudRefresh();
        }catch(e){ toast(String(e.message)); return; }
        after(); updateMsgButton();
        toast(op === "pin" ? (m.pinned ? "已取消置顶" : "已置顶") : "已删除");
        return;
      }
      if(op === "pin"){ m.pinned = !m.pinned; toast(m.pinned ? "已置顶" : "已取消置顶"); }
      else if(op === "del"){
        if(!confirm("确定删除这条消息？")) return;
        data.messages = data.messages.filter(function(x){ return x.id !== id; });
        toast("已删除");

        attachments: atts.slice()

/* 云端发布消息：先把附件上传到对象存储，再写入消息 */
async function publishMessageCloud(cid, txt, date, pinned, atts){
  var metas = [];
  for(var i=0;i<atts.length;i++){
    var a = atts[i];
    if(a.path){ metas.push({ name:a.name, size:a.size, type:a.type, path:a.path, img:!!a.img }); continue; }
    var up = await cloudUploadAtt(a, cid);
    metas.push({ name:a.name, size:a.size, type:a.type, path:up.path, img:!!a.img });
  }
  return await cloudRpc("api_save_message", { p_token:CLOUD.token, p_msg:{
    class_id:cid, date:date, content:txt, pinned:!!pinned,
    author:(currentUser() ? currentUser().username : ""), attachments:metas, created_at_ms:Date.now()
  } });
}

function csvCell(v){ v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function buildCsv(cid){
  var t = tt(cid), lines = ["节次,开始时间,结束时间," + DAYS.join(",")];
  for(var r=0;r<t.periods.length;r++){
    var row = [(r+1), t.periods[r].s, t.periods[r].e];
    for(var d=0;d<DAYS.length;d++){ row.push((t.grid[r] && t.grid[r][d]) || ""); }
    lines.push(row.map(csvCell).join(","));
  }
  lines.push(["午休", t.lunch.s, t.lunch.e, "", "", "", "", ""].map(csvCell).join(","));
  return "\uFEFF" + lines.join("\r\n") + "\r\n";
}
function exportCsv(cid){
  var blob = new Blob([buildCsv(cid)], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentSchool().name + className(cid) + "课程表模板.csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("模板已下载");
}
function parseCsv(text){
  text = String(text).replace(/^\uFEFF/, "");
  var rows = [], row = [], cell = "", q = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }else{
      if(c === '"') q = true;
      else if(c === ','){ row.push(cell); cell = ""; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else if(c !== '\r') cell += c;
    }
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.join("").trim() !== ""; });
}
function importCsvText(text, cid){
  cid = cid || viewClassId();
  var rows = parseCsv(text);
  if(!rows.length) return { ok:false, msg:"文件为空" };
  var head = rows[0].map(function(s){ return String(s).trim(); });
  var dayCols = [];
  for(var d=0; d<DAYS.length; d++){
    var idx = head.indexOf(DAYS[d]);
    if(idx < 0) return { ok:false, msg:"表头缺少「" + DAYS[d] + "」列，请使用下载的模板" };
    dayCols.push(idx);
  }
  var periods = [], grid = [], lunch = null;
  for(var r=1;r<rows.length;r++){
    var c0 = String(rows[r][0] || "").trim();
    if(!c0) continue;
    if(/午休|休息|午间/.test(c0)){
      lunch = { s:String(rows[r][1]||"").trim() || "12:40", e:String(rows[r][2]||"").trim() || "14:00" };
      continue;
    }
    var s = String(rows[r][1] || "").trim(), e = String(rows[r][2] || "").trim();
    if(hm2min(s) == null || hm2min(e) == null) return { ok:false, msg:"第 " + (periods.length+1) + " 行时间格式不对（应形如 8:00）" };
    var vals = [];
    for(var k=0;k<DAYS.length;k++){
      var v = String(rows[r][dayCols[k]] || "").trim();
      vals.push(v || null);
    }
    periods.push({ s:s, e:e }); grid.push(vals);
  }
  if(!periods.length) return { ok:false, msg:"没有解析到任何节次" };
  var t = tt(cid);
  t.periods = periods; t.grid = grid;
  if(lunch) t.lunch = lunch;
  return { ok:true, msg:"共 " + periods.length + " 节" };
}
window.kcbImportCsvText = importCsvText;

    : me.classId;
  $("paneMsg").innerHTML =
    '<div class="row" style="margin-bottom:10px">' +
    (admin ? '<span class="hint">学校 / 班级：</span><select class="in" id="mpClass" style="max-width:260px">' +
      allowed.map(function(c){
        var label = ((schoolById(c.schoolId) || {}).name || "") + " · " + c.name;
        return '<option value="' + c.id + '"' + (c.id === cid ? " selected" : "") + '>' + esc(label) + '</option>';
      }).join("") + '</select>'
      : '<span class="hint">当前班级：<b>' + esc(className(cid)) + '</b>（仅本班）</span>') +
    '</div><div id="mpList"></div>';
  if(admin){ $("mpClass").addEventListener("change", function(){ ttClassId = $("mpClass").value; renderMsgPane(); }); }
  renderMsgPaneList(cid);
}
function renderMsgPaneList(cid){
  var editable = canEditClass(cid);
  var atts = [];
  var all = msgsOf(cid).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  var h = '<div class="sect">发布消息</div><div class="frm">' +
    '<label>日期</label><input class="in" type="date" id="mpDate" value="' + todayStr() + '">' +
    '<label>内容</label><textarea class="in" id="mpText" placeholder="例如：今天数学作业 P34 1-6 题；也可直接 Ctrl+V 粘贴截图"></textarea>' +
    attachBoxHtml("mp") +
    '<label>置顶</label><div class="row"><input type="checkbox" id="mpPin"><span class="hint">置顶后长期显示</span></div>' +
    '</div><div class="row" style="margin-top:10px"><button class="btn" id="mpAdd">发布消息</button></div>';
  h += '<div class="sect">消息列表（' + esc(className(cid)) + '，共 ' + all.length + ' 条）</div>';
  h += all.length ? all.map(function(m){ return msgItemHtml(m, editable); }).join("") : '<div class="hint">暂无消息</div>';
  $("mpList").innerHTML = h;
  bindAttach("mp", atts);
  $("mpAdd").addEventListener("click", async function(){
    var txt = $("mpText").value.trim();
    if(!txt && !atts.length){ toast("请输入内容或添加附件"); return; }
    if(cloudOn()){
      try{
        await publishMessageCloud(cid, txt, $("mpDate").value || todayStr(), $("mpPin").checked, atts);
        await cloudRefresh();
      }catch(e){ toast(String(e.message)); return; }
      renderMsgPaneList(cid); updateMsgButton(); toast("已发布");
      return;
    }
    data.messages.push({
      id: uid("m"), classId: cid, date: $("mpDate").value || todayStr(), content: txt,
      pinned: $("mpPin").checked, author: currentUser().username, createdAt: Date.now(),
      attachments: atts.slice()
    });
    saveData(); renderMsgPaneList(cid); updateMsgButton(); toast("已发布");
  });
  bindMsgOps($("mpList"), function(){ renderMsgPaneList(cid); });
}

/* ================================================================
   六、启动
================================================================ */
function renderAll(){
  renderBrand(); renderDateTime(); renderTable(); renderLiveNow(); updateMsgButton();
}
$("setBtn").addEventListener("click", function(){
  if(!currentUser()){ openLogin(); return; }
  openAdmin();
});
$("msgBtn").addEventListener("click", function(){ renderMessages(); openModal("maskMsg"); });
$("wxCard").addEventListener("click", function(){ switchCity(); });
$("lgBtn").addEventListener("click", doLogin);
$("lgPass").addEventListener("keydown", function(ev){ if(ev.key === "Enter") doLogin(); });
$("lgUser").addEventListener("keydown", function(ev){ if(ev.key === "Enter") $("lgPass").focus(); });
$("logoutLink").addEventListener("click", async function(){
  if(cloudOn()){
    try{ await cloudRpc("api_logout", { p_token: CLOUD.token }); }catch(e){}
    CLOUD.token = null; CLOUD.userId = null; storeToken(null); CLOUD.online = false;
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    data = seedData();
    renderAll(); renderSyncState(); toast("已退出登录（云端数据保留）");
    return;
  }
  data.session = null; saveData(); renderAll(); toast("已退出登录");
});

(async function init(){
  if(cloudEnabled()){
    CLOUD.token = (function(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } })();
  }
  data = loadData();
  if(!cloudEnabled()){
    /* 本机模式：初始化默认账号密码 */
    var changed = false;
    for(var i=0;i<data.users.length;i++){
      var u0 = data.users[i];
      if(!u0.pass && DEF_PASS[u0.username]){ u0.pass = await hashPass(u0.username, DEF_PASS[u0.username]); changed = true; }
    }
    if(changed) saveData();
  }else if(CLOUD.token){
    /* 云端模式：用已保存的登录令牌自动恢复会话 */
    try{
      var bs = await cloudRpc("api_bootstrap", { p_token: CLOUD.token });
      applyCloud(bs);
    }catch(e){
      CLOUD.online = false;
      if(String(e.message).indexOf("登录已过期") >= 0 || String(e.message).indexOf("请先登录") >= 0){
        CLOUD.token = null; storeToken(null);
      }
    }
  }
  renderAll();
  renderSyncState();
  loadWeather();
  setInterval(function(){ renderDateTime(); renderTable(); renderLiveNow(); }, 20000);
  setInterval(loadWeather, 15 * 60 * 1000);
  /* 每 5 分钟自动同步一次云端数据（多人协作时能看到彼此的最新内容） */
  setInterval(function(){ if(cloudOn()) cloudRefresh(); }, 5 * 60 * 1000);
})();
</script>
